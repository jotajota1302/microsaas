<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crear el cuento — Familia de cuento</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Karla:wght@400;700&family=Andika:wght@400;700&display=swap">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/app.css">
<script src="/assets/js/options.js" defer></script>
<script src="/assets/js/i18n.js" defer></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand-mark" href="/"><svg class="mark" viewBox="0 0 40 40" fill="none" aria-hidden="true"><g stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 L33 16"/><path d="M20 6 L7 16"/><path d="M9.5 17.5 V32 h21 V17.5"/><path d="M20 6 V32"/></g><circle cx="14.5" cy="23" r="1.8" fill="currentColor"/><circle cx="25.5" cy="23" r="1.8" fill="currentColor"/></svg><span class="wordmark">Familia de <b>cuento</b></span><span class="tag">el cuento de su vida</span></a>
    <a class="lang" id="langlink" href="?lang=en">English</a>
  </header>

  <main class="stack-lg">
    <div class="stack">
      <h1 data-i18n="create_title"></h1>
      <p class="muted" data-i18n="create_lede"></p>
    </div>

    <form id="f" class="stack-lg" novalidate>
      <fieldset class="stack">
        <legend data-i18n="child"></legend>
        <div class="grid">
          <label><span data-i18n="name"></span><input type="text" name="name" maxlength="30" required autocomplete="off"><span class="hint" data-i18n="name_hint"></span></label>
          <label><span data-i18n="gender"></span><select name="gender" data-options="genders" required></select></label>
          <label><span data-i18n="age"></span><select name="ageBand" data-options="ageBands" required></select><span class="hint" data-i18n="age_hint"></span></label>
          <label><span data-i18n="hair"></span><select name="hairColor" data-options="hairColors" required></select></label>
          <label><span data-i18n="hair_type"></span><select name="hairType" data-options="hairTypes" required></select></label>
          <label><span data-i18n="skin"></span><select name="skin" data-options="skinTones" required></select></label>
          <label><span data-i18n="pet"></span><select name="pet" data-options="pets"></select></label>
          <label><span data-i18n="hobby"></span><select name="hobby" data-options="hobbies" required></select><span class="hint" data-i18n="hobby_hint"></span></label>
        </div>
        <label class="check"><input type="checkbox" name="glasses"><span data-i18n="glasses"></span></label>
      </fieldset>

      <fieldset class="stack">
        <legend data-i18n="world"></legend>
        <div class="grid">
          <label><span data-i18n="theme"></span><select name="theme" data-options="themes" required></select></label>
          <label><span data-i18n="moment"></span><select name="moment" data-options="moments" required></select></label>
          <label><span data-i18n="tone"></span><select name="tone" data-options="tones" required></select></label>
        </div>
      </fieldset>

      <fieldset class="stack">
        <legend data-i18n="people"></legend>
        <p class="muted" style="font-size:.9rem" data-i18n="people_hint"></p>
        <div id="people" class="stack"></div>
        <div><button type="button" class="btn secondary" id="addPerson" data-i18n="add_person"></button></div>
      </fieldset>

      <fieldset class="stack">
        <legend data-i18n="dedication"></legend>
        <label><span class="visually-hidden" data-i18n="dedication"></span><textarea name="dedication" maxlength="140"></textarea><span class="hint" data-i18n="dedication_hint"></span></label>
        <label><span data-i18n="notes"></span><textarea name="notes" maxlength="300" rows="3"></textarea><span class="hint" data-i18n="notes_hint"></span></label>
      </fieldset>

      <fieldset class="stack">
        <legend data-i18n="email"></legend>
        <label><span class="visually-hidden" data-i18n="email"></span><input type="email" name="email" required autocomplete="email"><span class="hint" data-i18n="email_hint"></span></label>
        <label class="check"><input type="checkbox" name="consent" required><span data-i18n="consent"></span></label>
      </fieldset>

      <div id="msg" class="note" hidden></div>
      <div class="row">
        <button type="submit" class="btn big" id="submit"><span data-i18n="submit"></span></button>
      </div>
    </form>

    <form id="wait" class="card stack" hidden>
      <p data-i18n="sold_out"></p>
      <div class="row"><input type="email" name="email" required style="max-width:20rem"><button class="btn">OK</button></div>
    </form>
  </main>

  <footer>
    <a href="/legal/">Aviso legal</a><a href="/legal/#privacidad">Privacidad</a><a href="/legal/#condiciones">Condiciones</a>
  </footer>
</div>

<script>
(function () {
  const ready = () => window.CUENTOS_OPTIONS && window.CUENTOS_I18N;
  if (!ready()) return document.addEventListener("DOMContentLoaded", init); else init();

  function init() {
    const lang = window.cuentosLang();
    const T = window.CUENTOS_I18N[lang];
    const O = window.CUENTOS_OPTIONS;
    document.documentElement.lang = lang;
    document.getElementById("langlink").textContent = lang === "es" ? "English" : "Español";
    document.getElementById("langlink").href = lang === "es" ? "?lang=en" : "?lang=es";
    document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = T[el.dataset.i18n] || ""; });

    const fill = (select, key, placeholder) => {
      select.innerHTML = "";
      const ph = document.createElement("option"); ph.value = ""; ph.textContent = placeholder || "—"; ph.disabled = true; ph.selected = true;
      select.appendChild(ph);
      for (const o of O[key]) { const opt = document.createElement("option"); opt.value = o.id; opt.textContent = o[lang]; select.appendChild(opt); }
    };
    document.querySelectorAll("select[data-options]").forEach((s) => fill(s, s.dataset.options));
    document.querySelector("select[name=pet]").value = "ninguna";

    // people
    const people = document.getElementById("people");
    const addBtn = document.getElementById("addPerson");
    function addPerson() {
      if (people.children.length >= O.maxPeople) return;
      const row = document.createElement("div");
      row.className = "grid";
      row.innerHTML = `
        <label><span>${T.relation}</span><select data-p="relation" required></select></label>
        <label><span>${T.person_name}</span><input type="text" data-p="name" maxlength="30" required></label>
        <label><span>${T.person_age}</span><select data-p="ageBand"></select></label>
        <div style="align-self:end"><button type="button" class="btn ghost" data-remove>${T.remove}</button></div>`;
      const rel = row.querySelector("[data-p=relation]");
      fill(rel, "relations");
      const age = row.querySelector("[data-p=ageBand]");
      fill(age, "personAges", "—"); age.querySelector("option").disabled = false; age.value = "";

      // A father is not "3 to 5 years old". Adults are simply not asked, and
      // the field is cleared so a stale choice cannot be submitted.
      const ageField = age.closest("label");
      const syncAge = () => {
        const chosen = O.relations.find((r) => r.id === rel.value);
        const adult = Boolean(chosen && chosen.adult);
        ageField.hidden = adult;
        if (adult) age.value = "";
      };
      rel.onchange = syncAge;
      syncAge();
      row.querySelector("[data-remove]").onclick = () => { row.remove(); addBtn.hidden = false; };
      people.appendChild(row);
      addBtn.hidden = people.children.length >= O.maxPeople;
    }
    addBtn.onclick = addPerson;

    // The bot filter, if this deployment has one. The site key is public by
    // design; the secret only ever lives on the server.
    let tsWidget = null;
    (async () => {
      let cfg = {};
      try { cfg = await (await fetch("/api/config")).json(); } catch (e) { return; }
      if (!cfg.turnstileSiteKey) return;
      const holder = document.createElement("div");
      holder.id = "ts";
      holder.style.marginTop = ".6rem";
      document.getElementById("submit").parentNode.insertBefore(holder, document.getElementById("submit"));
      const s = document.createElement("script");
      s.src = "https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";
      s.async = true;
      s.onload = () => { tsWidget = window.turnstile.render("#ts", { sitekey: cfg.turnstileSiteKey }); };
      document.head.appendChild(s);
    })();

    const form = document.getElementById("f");
    const msg = document.getElementById("msg");
    const submit = document.getElementById("submit");
    const show = (text, kind) => { msg.hidden = false; msg.className = "note " + (kind || ""); msg.textContent = text; };

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!form.reportValidity()) return;
      const fd = new FormData(form);
      const body = {
        email: fd.get("email"), locale: lang,
        personalization: {
          name: fd.get("name"), gender: fd.get("gender"), ageBand: fd.get("ageBand"), hairColor: fd.get("hairColor"), hairType: fd.get("hairType"),
          skin: fd.get("skin"), glasses: fd.get("glasses") === "on", pet: fd.get("pet") || "ninguna", hobby: fd.get("hobby"),
          theme: fd.get("theme"), moment: fd.get("moment"), tone: fd.get("tone"), dedication: fd.get("dedication"), notes: fd.get("notes"),
          people: [...people.children].map((row) => ({
            relation: row.querySelector("[data-p=relation]").value,
            name: row.querySelector("[data-p=name]").value,
            ageBand: row.querySelector("[data-p=ageBand]").value || null,
          })),
        },
      };
      // Turnstile only exists when it is configured; when it is, the token is
      // required, so an unsolved challenge stops here rather than at the API.
      if (window.turnstile && document.getElementById("ts")) {
        body.turnstile = window.turnstile.getResponse(tsWidget);
        if (!body.turnstile) { show(T.error, "alarm"); return; }
      }
      submit.disabled = true; submit.innerHTML = `<span class="spinner"></span> ${T.writing}`;
      try {
        const res = await fetch("/api/order", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
        const data = await res.json().catch(() => ({}));
        if (res.status === 201 && data.token) { location.href = `/c/${data.token}`; return; }
        if (res.status === 202) { show(T.sent_email, "sea"); return; }
        if (res.status === 503) { form.hidden = true; document.getElementById("wait").hidden = false; return; }
        if (res.status === 429) { show(T[data.error] || T.error, "alarm"); return; }
        if (res.status === 422) { show(T.blocked, "alarm"); return; }
        // A 504 is the function's clock running out, not a lost story: the
        // sweep on the server finishes writing it and the email still arrives.
        if (res.status === 504 || res.status === 502) { show(T.sent_email, "sea"); return; }
        show(T.error, "alarm");
      } catch {
        // The request left and the answer did not come back: on this shop the
        // second attempt would be refused (one story per address per day), so
        // "it is on its way" is both kinder and likelier than "it failed".
        show(navigator.onLine === false ? T.error : T.sent_email, navigator.onLine === false ? "alarm" : "sea");
      }
      finally { submit.disabled = false; submit.innerHTML = `<span>${T.submit}</span>`; }
    });

    document.getElementById("wait").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = new FormData(e.target).get("email");
      await fetch("/api/waitlist", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email, locale: lang, reason: "cap" }) });
      e.target.innerHTML = `<p>${T.waitlist_ok}</p>`;
    });
  }
})();
</script>
</body>
</html>
