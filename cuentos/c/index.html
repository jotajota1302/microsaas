<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tu cuento — Familia de cuento</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Karla:wght@400;700&family=Andika:wght@400;700&display=swap">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/app.css">
<script src="/assets/js/i18n.js" defer></script>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <a class="brand-mark" href="/"><svg class="mark" viewBox="0 0 40 40" fill="none" aria-hidden="true"><g stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 L33 16"/><path d="M20 6 L7 16"/><path d="M9.5 17.5 V32 h21 V17.5"/><path d="M20 6 V32"/></g><circle cx="14.5" cy="23" r="1.8" fill="currentColor"/><circle cx="25.5" cy="23" r="1.8" fill="currentColor"/></svg><span class="wordmark">Familia de <b>cuento</b></span></a>
    <div class="stages" id="stages" aria-label="Estado"></div>
    <span class="exp" id="exp"></span>
  </div>

  <main id="main" class="stack-lg" style="padding-top:1.5rem">
    <p class="muted" id="status"><span class="spinner"></span> …</p>
  </main>

  <footer>
    <a href="/legal/">Aviso legal</a><a href="/legal/#privacidad">Privacidad</a><a href="/legal/#condiciones">Condiciones</a>
  </footer>
</div>

<script>
(function () {
  if (!window.CUENTOS_I18N) return document.addEventListener("DOMContentLoaded", init); else init();

  function init() {
    const token = location.pathname.split("/").filter(Boolean).pop();
    const main = document.getElementById("main");
    const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    let T = window.CUENTOS_I18N[window.cuentosLang()];
    let view = null;
    let driving = false;

    /** Paid for, not delivered yet: the book is being made or checked. */
    const making = () => view && view.stage !== "full" && (view.status === "paid" || view.status === "needs_review");

    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

    /*
     * A serverless function cannot illustrate twelve pages in one go, so the
     * work comes in batches and someone has to ask for the next one. While
     * this page is open, it is this page. Closing it is safe: the sweep on the
     * server finishes what is left and the email still arrives.
     */
    async function drive() {
      if (driving) return;
      driving = true;
      try {
        for (;;) {
          let data = {};
          try {
            const res = await fetch("/api/resume", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token }) });
            data = await res.json().catch(() => ({}));
          } catch (e) {
            await sleep(3000); // a dropped connection is not the end of the book
            continue;
          }
          if (data.total) {
            const fill = document.getElementById("barfill");
            const note = document.getElementById("barnote");
            if (fill) fill.style.width = `${Math.round((data.illustrated / data.total) * 100)}%`;
            if (note) note.textContent = `${data.illustrated} ${T.making_count} ${data.total}`;
          }
          if (data.state === "pending" || data.state === "locked") { await sleep(1500); continue; }
          break;
        }
      } finally {
        driving = false;
      }
      await load();
    }

    async function load() {
      const res = await fetch(`/api/story?token=${encodeURIComponent(token)}`);
      if (res.status === 410) return renderMessage(T.expired_title, T.expired_body);
      if (!res.ok) return renderMessage(T.not_found, "");
      view = await res.json();
      T = window.CUENTOS_I18N[view.locale] || T;
      document.documentElement.lang = view.locale;
      document.title = view.title;
      render();
    }

    function renderMessage(title, body) {
      main.innerHTML = `<div class="card stack"><h1>${esc(title)}</h1><p class="muted">${esc(body)}</p><p><a class="btn" href="/crear/">${T.submit}</a></p></div>`;
    }

    function stagesHtml(stage) {
      const order = ["script", "sample", "full"];
      return order.map((s) => `<span class="${s === stage ? "on" : ""}">${T["stage_" + s]}</span>`).join("");
    }

    function pageHtml(p) {
      // The wait is different at each gate: saying "when you complete the story"
      // during the script stage hides the free illustrated sample in between.
      const waiting = view.stage === "script" ? T.later_script : T.later_sample;
      return `
        <article class="pg${p.image ? " drawn" : ""}">
          <div class="art ${p.image ? "" : "later"}">
            ${p.image ? `<img src="${p.image}" alt="" loading="lazy">` : `<div class="veil"><span>${waiting}</span></div>`}
          </div>
          <div class="txt story-text"><p>${esc(p.text)}</p><span class="n">${p.n}</span></div>
        </article>`;
    }

    function pagesHtml(pages) {
      return (pages || view.pages).map(pageHtml).join("");
    }

    /** Where you are, what you already have, and what the next step gives you. */
    function railHtml() {
      const order = ["script", "sample", "full"];
      const at = order.indexOf(view.stage);
      return `<ol class="rail">` + order.map((s, i) => {
        const state = i < at ? "done" : i === at ? "now" : "next";
        const badge = i < at ? T.step_done : i === at ? T.step_now : T.step_next;
        return `<li class="${state}">
          <span class="rail-n">${i + 1}</span>
          <span class="rail-b">${badge}</span>
          <b>${T["rail_" + (i + 1) + "_title"]}</b>
          <span class="rail-note">${T["rail_" + (i + 1) + "_note"]}</span>
        </li>`;
      }).join("") + `</ol>`;
    }

    function render() {
      document.getElementById("stages").innerHTML = stagesHtml(view.stage);
      document.getElementById("exp").textContent = `${T.expires} ${new Date(view.expiresAt).toLocaleDateString(view.locale === "en" ? "en-GB" : "es-ES", { day: "numeric", month: "long" })}`;

      const intro = view.stage === "script" ? T.script_intro : view.stage === "sample" ? T.sample_intro : T.full_intro;
      let actions = "";
      if (making()) {
        // Paid and not delivered yet. Never show the buy card again here: it
        // would read as "pay twice".
        const pct = view.total ? Math.round((view.illustrated / view.total) * 100) : 0;
        const checking = view.status === "needs_review";
        actions = `
          <div class="card stack" id="actions">
            <h2>${checking ? T.review_title : T.making_title}</h2>
            <p class="muted">${checking ? T.review_body : T.making_body}</p>
            ${checking ? "" : `
              <div class="pbar"><span id="barfill" style="width:${pct}%"></span></div>
              <p class="muted" id="barnote" style="font-size:.9rem">${view.illustrated} ${T.making_count} ${view.total}</p>`}
            <div id="amsg" class="note" hidden></div>
          </div>`;
      } else if (view.stage === "script") {
        actions = `
          <div class="card stack" id="actions">
            <div class="row">
              <button class="btn big" id="like">${T.like}</button>
              <button class="btn secondary" id="changeBtn" ${view.revisionsLeft ? "" : "disabled"}>${T.change} · ${view.revisionsLeft} ${T.changes_left}</button>
            </div>
            ${view.revisionsLeft ? "" : `<p class="muted" style="font-size:.9rem">${T.no_changes_left}</p>`}
            <form id="changeForm" class="stack" hidden>
              <textarea name="instruction" maxlength="200" minlength="3" required placeholder="${esc(T.change_placeholder)}"></textarea>
              <div class="row"><button class="btn">${T.change_send}</button></div>
            </form>
            <div id="amsg" class="note" hidden></div>
          </div>`;
      } else if (view.stage === "sample") {
        const tick = (t) => `<li><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg><span>${t}</span></li>`;
        actions = `
          <div class="card stack buy" id="actions">
            <div class="buy-head">
              <h2>${T.complete}</h2>
              <span class="buy-price">${esc(view.price)}</span>
            </div>
            <p class="muted">${T.complete_body}</p>
            <ul class="ticks">${tick(T.complete_1)}${tick(T.complete_2)}${tick(T.complete_3)}${tick(T.complete_4)}</ul>
            ${view.canPayByCard
              ? `<div class="row"><button class="btn big" id="payBtn">${T.buy_card}</button></div>`
              : view.etsyUrl
                ? `<div class="row"><a class="btn big" href="${view.etsyUrl}" target="_blank" rel="noopener">${T.buy_etsy}</a></div><p class="muted" style="font-size:.9rem">${T.etsy_code} <code>${view.token}</code></p>`
                : `<p class="note">${T.etsy_soon}</p>`}
            <div id="amsg" class="note" hidden></div>
          </div>`;
      } else {
        actions = `
          <div class="card stack" id="actions">
            <div class="row">
              <a class="btn big" href="${view.pdf}" download>${T.download}</a>
              <button class="btn secondary" id="printBtn">${T.print_interest}</button>
            </div>
            <p class="muted" style="font-size:.9rem">${T.retouch_hint}</p>
            <div id="amsg" class="note" hidden></div>
          </div>`;
      }

      const sheet = view.sheet ? `<figure class="sheet"><img src="${view.sheet}" alt=""><figcaption>${T.so_is} ${esc(view.childName)}</figcaption></figure>` : "";
      const coloring = view.coloring && view.coloring.length
        ? `<section class="stack"><h2>${T.coloring}</h2><div class="grid">${view.coloring.map((u) => `<a href="${u}" target="_blank" rel="noopener"><img src="${u}" alt="" style="width:100%;border:1px solid var(--hair);border-radius:10px;background:#fff"></a>`).join("")}</div></section>`
        : "";

      // At the sample gate the two drawn pages lead and the offer sits right
      // under them: that is the moment the buyer has just seen what they get.
      const drawn = view.pages.filter((p) => p.image);
      const showcase = view.stage === "sample" && !making() && drawn.length
        ? `<section class="stack"><h2>${T.sample_here}</h2><div class="book showcase">${pagesHtml(drawn)}</div></section>`
        : "";
      const nodraw = view.stage === "script"
        ? `<div class="card stack nodraw">
             <h2>${T.script_nodraw_title}</h2>
             <p class="muted">${T.script_nodraw_body}</p>
           </div>`
        : "";

      // No step is a dead end. From the sample you can still spend a free
      // rewrite and go back; from anywhere you can keep the link or start over.
      const backOut = view.stage === "sample" && !making() && view.revisionsLeft
        ? `<div class="card stack nodraw" id="backout">
             <h3>${T.back_title}</h3>
             <p class="muted">${T.back_body}</p>
             <form id="changeForm" class="stack">
               <textarea name="instruction" maxlength="200" minlength="3" required placeholder="${esc(T.change_placeholder)}"></textarea>
               <div class="row"><button class="btn secondary">${T.back_btn}</button></div>
             </form>
             <div id="amsg" class="note" hidden></div>
           </div>`
        : "";
      const escape = `<p class="muted escape">
          ${T.keep_link} ${new Date(view.expiresAt).toLocaleDateString(view.locale === "en" ? "en-GB" : "es-ES", { day: "numeric", month: "long" })} ·
          <a href="/crear/${view.locale === "en" ? "?lang=en" : ""}">${T.other_story}</a>
        </p>`;

      // While the book is being made there is nothing to decide and nothing to
      // read: showing the twelve pages under a progress bar is just something
      // to get lost in. The page holds still until it is finished.
      main.innerHTML = making()
        ? `
        ${railHtml()}
        <div class="stack">
          <h1>${esc(view.title)}</h1>
          <p class="muted story-text"><em>${esc(view.dedication)}</em></p>
        </div>
        ${actions}
        ${sheet}
        ${escape}`
        : `
        ${railHtml()}
        <div class="stack">
          <h1>${esc(view.title)}</h1>
          <p class="muted story-text"><em>${esc(view.dedication)}</em></p>
          <p class="note sea">${intro}</p>
        </div>
        ${sheet}
        ${showcase}
        ${actions}
        ${backOut}
        ${nodraw}
        <div class="book">${pagesHtml()}</div>
        <p class="muted story-text"><b>${T.moral}:</b> ${esc(view.moral)}</p>
        ${coloring}
        ${escape}`;

      bind();
      // Only "paid" means work is owed: "needs_review" is a person's turn.
      if (view.status === "paid" && view.stage !== "full") drive();
      // ...but a person's turn ends, and the page has to notice. Without this
      // the screen said "we are checking it" for ever, long after the book had
      // been approved and delivered.
      else if (making()) watch();
    }

    let watching = false;
    async function watch() {
      if (watching) return;
      watching = true;
      try {
        while (making()) {
          await sleep(15000);
          const res = await fetch(`/api/story?token=${encodeURIComponent(token)}`).catch(() => null);
          if (!res || !res.ok) continue;
          const next = await res.json().catch(() => null);
          if (!next) continue;
          const changed = next.stage !== view.stage || next.status !== view.status;
          view = next;
          if (changed) { render(); return; }
        }
      } finally {
        watching = false;
      }
    }

    function busy(btn, text) { btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> ${text}`; }
    const amsg = () => document.getElementById("amsg");
    const say = (text, kind) => { const m = amsg(); if (!m) return; m.hidden = false; m.className = "note " + (kind || ""); m.textContent = text; };

    function bind() {
      const like = document.getElementById("like");
      if (like) like.onclick = async () => {
        busy(like, T.illustrating);
        const res = await fetch("/api/approve", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token }) });
        if (res.ok) return load();
        const data = await res.json().catch(() => ({}));
        say(res.status === 503 ? T.sold_out : T.error, "alarm");
        like.disabled = false; like.textContent = T.like;
      };
      const changeBtn = document.getElementById("changeBtn");
      const changeForm = document.getElementById("changeForm");
      // The toggle only exists at the script gate; at the sample gate the form
      // is already open under the way-out card, so they bind separately.
      if (changeBtn && changeForm) {
        changeBtn.onclick = () => { changeForm.hidden = !changeForm.hidden; changeForm.querySelector("textarea").focus(); };
      }
      if (changeForm) {
        const label = changeForm.querySelector("button").textContent;
        changeForm.onsubmit = async (e) => {
          e.preventDefault();
          const instruction = new FormData(changeForm).get("instruction");
          const b = changeForm.querySelector("button"); busy(b, T.writing);
          const res = await fetch("/api/revise", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token, instruction }) });
          if (res.ok) return load();
          say(res.status === 422 ? T.blocked : T.error, "alarm");
          b.disabled = false; b.textContent = label;
        };
      }
      const payBtn = document.getElementById("payBtn");
      if (payBtn) payBtn.onclick = async () => {
        busy(payBtn, T.paying);
        try {
          const res = await fetch("/api/checkout", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token }) });
          const data = await res.json();
          if (res.ok && data.url) return location.assign(data.url);
          say(T.error, "alarm");
        } catch (e) {
          say(T.error, "alarm");
        }
        payBtn.disabled = false; payBtn.textContent = T.buy_card;
      };
      const printBtn = document.getElementById("printBtn");
      if (printBtn) printBtn.onclick = async () => {
        busy(printBtn, "…");
        await fetch("/api/print-interest", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token }) });
        printBtn.textContent = "✓";
        say(T.print_thanks, "sea");
      };
    }

    load().catch(() => renderMessage(T.error, ""));
  }
})();
</script>
</body>
</html>
