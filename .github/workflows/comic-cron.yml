# Empuja los trabajos de MyOwnManga que nadie está mirando.
#
# POR QUÉ AQUÍ Y NO EN vercel.json: el plan Hobby solo permite crons DIARIOS
# (Vercel rechaza el despliegue con `cron_jobs_limits_reached` si pides más).
# Un cómic pagado cuyo comprador cierre la pestaña esperaría hasta 24 h.
#
# /api/cron es solo un endpoint HTTP con un secreto, así que lo puede llamar
# cualquier cosa. Esto es gratis y no depende del plan.
#
# LO QUE HAY QUE SABER de los crons de GitHub Actions, para que nadie se
# sorprenda luego:
#   - el mínimo son 5 minutos, y bajo carga se retrasan (a veces 10-20 min).
#     Da igual: es una red de seguridad, no el mecanismo principal. El
#     principal es que el visor empuja mientras alguien mira.
#   - se desactivan solos tras 60 días sin actividad en el repo. GitHub avisa.
#
# HACE FALTA configurar dos secretos del repositorio
# (Settings -> Secrets and variables -> Actions):
#   COMIC_BASE_URL   https://myownmanga.com   (o la URL de Vercel)
#   COMIC_CRON_SECRET  el mismo valor que CRON_SECRET en Vercel
# Sin ellos el workflow no falla: no hace nada y lo dice.

name: comic · barrido

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # para poder lanzarlo a mano desde la pestaña Actions

concurrency:
  # Un barrido a la vez. Dos concurrentes no romperían nada — cada trabajo se
  # reclama con `locked_until` — pero gastarían invocaciones para nada.
  group: comic-cron
  cancel-in-progress: false

jobs:
  barrer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Llamar a /api/cron
        env:
          BASE: ${{ secrets.COMIC_BASE_URL }}
          SECRET: ${{ secrets.COMIC_CRON_SECRET }}
        run: |
          if [ -z "$BASE" ] || [ -z "$SECRET" ]; then
            echo "Faltan COMIC_BASE_URL o COMIC_CRON_SECRET: no hago nada."
            echo "Configúralos en Settings -> Secrets and variables -> Actions."
            exit 0
          fi

          # EL CUERPO NO SE IMPRIME, y esto no es prudencia genérica.
          #
          # Este repositorio es público, así que los logs de Actions son
          # públicos. La respuesta de /api/cron lleva el identificador de cada
          # pedido que ha tocado, y ese identificador ES la autorización
          # completa: con él se abre /c/<token> y se descarga el PDF que
          # alguien ha pagado. La primera versión de este paso usaba
          # `curl --silent` sin -o, que escribe el cuerpo en stdout SIEMPRE
          # (no solo al fallar). Habría publicado enlaces funcionales a los
          # cómics de los clientes cada cinco minutos.
          #
          # Lo que queda es lo único que hace falta saber desde aquí: si el
          # barrido respondió. El detalle está en los logs de Vercel, que son
          # privados y es donde debe estar.
          code=$(curl --silent --show-error -o /dev/null -w '%{http_code}' \
                      --max-time 240 \
                      -H "Authorization: Bearer $SECRET" \
                      "${BASE%/}/api/cron")
          echo "HTTP $code"
          case "$code" in
            2*) exit 0 ;;
            401) echo "401: COMIC_CRON_SECRET no coincide con CRON_SECRET en Vercel."; exit 1 ;;
            *)   echo "El barrido no respondió correctamente. Mira los logs de Vercel."; exit 1 ;;
          esac
